name: Low-hanging fruit focused audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/low-hanging-fruit-audit.yml'
      - 'FormalConjectures/Other/LowHangingFruitAudit.lean'

concurrency:
  group: low-hanging-fruit-focused-audit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          repository: DomTheDeveloper/formal-conjectures
          ref: agent/low-hanging-fruit-audit
          fetch-depth: 1
      - name: Install Lean
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            .lake/packages
            .lake/build
          key: low-hanging-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}
          restore-keys: low-hanging-${{ runner.os }}-${{ runner.arch }}-
      - name: Get Mathlib cache
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            lake exe cache get && exit 0
            sleep 10
          done
          exit 1
      - name: Compile audit module
        run: |
          set -o pipefail
          lake build FormalConjectures.Other.LowHangingFruitAudit 2>&1 | tee /tmp/low-hanging-compile.log
      - name: Audit clean theorem axioms
        if: success()
        run: |
          cat > /tmp/LowHangingAxioms.lean <<'EOF'
          import FormalConjectures.Other.LowHangingFruitAudit
          #print axioms DedekindNumber.M_eq_via_antichains
          #print axioms MovingSofa.not_literal_uniqueness
          EOF
          lake env lean /tmp/LowHangingAxioms.lean 2>&1 | tee /tmp/low-hanging-axioms.log
          ! grep -E 'sorryAx|Lean\.ofReduceBool|Lean\.trustCompiler' /tmp/low-hanging-axioms.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: low-hanging-fruit-${{ github.run_id }}
          path: |
            /tmp/low-hanging-compile.log
            /tmp/low-hanging-axioms.log
          if-no-files-found: warn
