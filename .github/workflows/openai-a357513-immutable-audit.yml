name: OpenAI immutable A357513 supercongruence audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/openai-a357513-immutable-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned current Lean toolchain
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            .lake/packages
            .lake/build
          key: a357513-current-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}
          restore-keys: a357513-current-${{ runner.os }}-${{ runner.arch }}-
      - name: Fetch compiled dependencies
        run: lake exe cache get
      - name: Fetch immutable proof source
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/google-deepmind/formal-conjectures/9c7f21e7d4445637538bc1817b058b9b3f31bd2b/FormalConjectures/OEIS/357513.lean' -o /tmp/A357513Immutable.lean
          test "$(sha256sum /tmp/A357513Immutable.lean | cut -d' ' -f1)" = '726088a9dcd90607ed1b9ef966fdb3b9657406b3c23768daa50c880970617f9d'
      - name: Reject proof holes and trust escapes
        run: |
          set -euo pipefail
          ! grep -nE '\b(sorry|admit)\b|native_decide|decide \+native|unsafe|axiom |Lean\.ofReduce|Lean\.ofReduceBool|Lean\.trustCompiler' /tmp/A357513Immutable.lean
      - name: Compile immutable proof on current toolchain
        run: |
          set -o pipefail
          lake env lean /tmp/A357513Immutable.lean 2>&1 | tee /tmp/a357513-build.log
      - name: Audit theorem axioms
        run: |
          cp /tmp/A357513Immutable.lean /tmp/A357513Axioms.lean
          cat >> /tmp/A357513Axioms.lean <<'EOF'

          #print axioms OeisA357513.a357513_supercongruence
          EOF
          lake env lean /tmp/A357513Axioms.lean 2>&1 | tee /tmp/a357513-axioms.log
          ! grep -E 'sorryAx|Lean\.ofReduce|Lean\.ofReduceBool|Lean\.trustCompiler' /tmp/a357513-axioms.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a357513-current-${{ github.run_id }}
          path: |
            /tmp/a357513-build.log
            /tmp/a357513-axioms.log
          if-no-files-found: warn
