name: Full quantum color-restriction proof audit

on:
  pull_request:
    branches:
      - main

concurrency:
  group: quantum-full-color-restriction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Quantum audit intentionally cancelled to release runners.'
