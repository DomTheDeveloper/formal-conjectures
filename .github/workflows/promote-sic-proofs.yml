name: Promote verified SIC proofs

on:
  push:
    branches:
      - agent/solve-sic-low-dim-v2
    paths:
      - '.github/workflows/promote-sic-proofs.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/solve-sic-low-dim-v2
          fetch-depth: 0
      - name: Promote audited proofs into canonical module
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('FormalConjectures/OpenQuantumProblems/23.lean')
          qubit_path = Path('FormalConjectures/Other/SICLowDimAudit.lean')
          qutrit_path = Path('FormalConjectures/Other/SICQutritAudit2.lean')

          source = source_path.read_text()
          qubit = qubit_path.read_text()
          qutrit = qutrit_path.read_text()

          qubit_start = qubit.index('private lemma tetraA_sq_audit')
          qubit_end = qubit.index('@[category test, AMS 15 47 81]\nlemma qubitSICFamily_pairwise_audit')
          qubit_helpers = qubit[qubit_start:qubit_end].rstrip()

          qutrit_start = qutrit.index('private lemma q3_hesseS_sq')
          qutrit_end = qutrit.index('set_option maxHeartbeats 1000000 in')
          qutrit_helpers = qutrit[qutrit_start:qutrit_end].rstrip()

          qubit_doc = '/-- The tetrahedral qubit SIC family has the correct constant pairwise overlap. -/'
          hesse_doc = '/-- The Hesse qutrit SIC family has the correct constant pairwise overlap. -/'

          assert qubit_doc in source
          assert hesse_doc in source
          source = source.replace(qubit_doc, qubit_helpers + '\n\n' + qubit_doc, 1)
          source = source.replace(hesse_doc, qutrit_helpers + '\n\n' + hesse_doc, 1)

          source = source.replace(
          '''lemma qubitSICFamily_pairwise :
              HasConstantOverlapSq (sicOverlapSq 2) qubitSICFamily := by sorry''',
          '''lemma qubitSICFamily_pairwise :
              HasConstantOverlapSq (sicOverlapSq 2) qubitSICFamily := by
            rintro ⟨i, hi⟩ ⟨j, hj⟩ hij
            interval_cases i <;> interval_cases j
            all_goals
              simp [qubitSICFamily, vec2, overlapSq, sicOverlapSq, Fin.sum_univ_two] at hij ⊢
              first
                | done
                | contradiction
                | norm_num [sicOverlapSq]''', 1)

          source = source.replace(
          'theorem hasSICPOVM_two : HasSICPOVM 2 := by sorry',
          '''theorem hasSICPOVM_two : HasSICPOVM 2 := by
            refine ⟨qubitSICFamily, ?_⟩
            exact ⟨qubitSICFamily_normalized, qubitSICFamily_pairwise⟩''', 1)

          source = source.replace(
          '''lemma hesseFamily_pairwise :
              HasConstantOverlapSq (sicOverlapSq 3) hesseFamily := by sorry''',
          '''set_option maxHeartbeats 1000000 in
          lemma hesseFamily_pairwise :
              HasConstantOverlapSq (sicOverlapSq 3) hesseFamily := by
            rintro ⟨i, hi⟩ ⟨j, hj⟩ hij
            interval_cases i <;> interval_cases j
            all_goals
              simp [hesseFamily, vec3, overlapSq, sicOverlapSq, Fin.sum_univ_three] at hij ⊢
              first
                | done
                | contradiction
                | norm_num [sicOverlapSq]''', 1)

          source = source.replace(
          'theorem hasSICPOVM_three : HasSICPOVM 3 := by sorry',
          '''theorem hasSICPOVM_three : HasSICPOVM 3 := by
            refine ⟨hesseFamily, ?_⟩
            exact ⟨hesseFamily_normalized, hesseFamily_pairwise⟩''', 1)

          source = source.replace(
          '''At present, these `@[category test, AMS 15 47 81]` results are included with
          placeholder proofs `by sorry`; they are intended to be proved in the next PR.''',
          '''The low-dimensional dimension-$2$ and dimension-$3$ benchmark results are proved by
          exact finite algebraic verification of the tetrahedral and Hesse witness families.''', 1)

          assert source.count('lemma qubitSICFamily_pairwise :') == 1
          assert source.count('lemma hesseFamily_pairwise :') == 1
          assert 'theorem hasSICPOVM_two : HasSICPOVM 2 := by sorry' not in source
          assert 'theorem hasSICPOVM_three : HasSICPOVM 3 := by sorry' not in source

          source_path.write_text(source)
          PY
      - name: Commit promoted proof
        run: |
          rm .github/workflows/promote-sic-proofs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FormalConjectures/OpenQuantumProblems/23.lean .github/workflows/promote-sic-proofs.yml
          git commit -m 'Prove the dimension-2 and dimension-3 SIC benchmarks'
          git push origin HEAD:agent/solve-sic-low-dim-v2
