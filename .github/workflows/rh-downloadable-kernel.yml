name: Publish the complete reduced kernel export in 17 parts
on:
  workflow_dispatch:
  push:
    branches: [rh/unconditional-reduction]
    paths: ['.github/workflows/rh-downloadable-kernel.yml']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 335
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce the complete kernel export
        working-directory: _certificates/RiemannReduction
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift /opt/ghc /opt/hostedtoolcache/CodeQL
          curl --fail --location --retry 4 --silent --show-error https://math.mit.edu/~drew/grh/solution.ndjson.zst -o "$RUNNER_TEMP/original.zst"
          bash reduce.sh "$RUNNER_TEMP/original.zst" "$RUNNER_TEMP/indexed-export" all share
      - name: Compress 17 parts and hash their full decoded contents
        working-directory: _certificates/RiemannReduction
        run: |
          set -euo pipefail
          bash emit.sh "$RUNNER_TEMP/original.zst" "$RUNNER_TEMP/indexed-export" all-share |
            python3 pack_export.py "$RUNNER_TEMP/packed-export"
      - name: Publish all the proof bytes and the verified range manifest
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/packed-export"
          tag="rh-kernel-$(jq -r '.sha256[:12]' export-manifest.json)"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          These 17 compressed byte ranges reconstruct the complete shortened five-theorem Lean kernel export (1,172,294 declaration records). In filename order, decompress and concatenate the ranges to reproduce the SHA-256 in export-manifest.json. The packing job verified every decoded byte. The branch README tracks the separate native and certified kernel replays of this exact export.

          To check locally, run `zstd -dc --long=27 rh-proof-??-of-17.zst > reduced.ndjson` and then `leanchecker --from-export reduced.ndjson` with Lean 4.36.0.
          EOF
            gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --latest=false --title 'Complete reduced Lean proof of RH and the four companion statements' --notes-file "$RUNNER_TEMP/notes.md"
          fi
          for f in rh-proof-??-of-17.zst export-manifest.json; do
            sha="sha256:$(sha256sum "$f" | cut -d' ' -f1)"
            for delay in 0 5 15; do
              sleep "$delay"
              remote=$(gh release view "$tag" --json assets --jq ".assets[] | select(.name == \"$f\") | .digest")
              if [[ "$remote" == "$sha" ]]; then break; fi
              if [[ -n "$remote" ]]; then echo "Existing digest differs for $f" >&2; exit 1; fi
              gh release upload "$tag" "$f" && break
            done
            remote=$(gh release view "$tag" --json assets --jq ".assets[] | select(.name == \"$f\") | .digest")
            [[ "$remote" == "$sha" ]]
          done
          gh release edit "$tag" --draft=false --prerelease --latest=false
