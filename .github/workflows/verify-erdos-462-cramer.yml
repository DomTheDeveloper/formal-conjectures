name: Verify Erdős 462
on:
  push:
    branches: [verify-erdos-462-cramer]
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install the repository toolchain
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the exact module and print its axioms
        run: |
          lake exe cache get
          lake --wfail build 'FormalConjectures.ErdosProblems.«462»'
          cat > "$RUNNER_TEMP/Audit462.lean" <<'EOF'
          import FormalConjectures.ErdosProblems.«462»
          #print axioms Erdos462.erdos_462
          EOF
          lake env lean "$RUNNER_TEMP/Audit462.lean"
