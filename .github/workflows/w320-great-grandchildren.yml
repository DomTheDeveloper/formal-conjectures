name: W320 great-grandchild certificates

on:
  push:
    branches: [agent/w320-great-grandchildren]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: w320-great-grandchildren-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'W320 matrix intentionally cancelled to release GitHub Actions runners.'
