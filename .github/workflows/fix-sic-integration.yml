name: Fix SIC proof integration

on:
  push:
    branches:
      - agent/solve-sic-low-dim-v2
    paths:
      - '.github/workflows/fix-sic-integration.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/solve-sic-low-dim-v2
          fetch-depth: 0
      - name: Apply integration fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('FormalConjectures/OpenQuantumProblems/23.lean')
          text = path.read_text()
          text = text.replace(
              '@[simp] private lemma omega_sq_audit :',
              'private lemma omega_sq_audit :',
              1,
          )
          old = '''/-- The Hesse qutrit SIC family has the correct constant pairwise overlap. -/
          @[category test, AMS 15 47 81]
          set_option maxHeartbeats 1000000 in
          lemma hesseFamily_pairwise :'''
          new = '''set_option maxHeartbeats 1000000 in
          /-- The Hesse qutrit SIC family has the correct constant pairwise overlap. -/
          @[category test, AMS 15 47 81]
          lemma hesseFamily_pairwise :'''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit integration fixes
        run: |
          rm .github/workflows/fix-sic-integration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FormalConjectures/OpenQuantumProblems/23.lean .github/workflows/fix-sic-integration.yml
          git commit -m 'Fix SIC proof integration'
          git push origin HEAD:agent/solve-sic-low-dim-v2
