name: OpenAI van der Waerden base-value audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/openai-vdw-base-audit.yml'
      - 'FormalConjectures/ErdosProblems/138Proof.lean'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Lean toolchain
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            .lake/packages
            .lake/build
          key: vdw-base-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}
          restore-keys: vdw-base-${{ runner.os }}-${{ runner.arch }}-
      - name: Fetch compiled dependencies
        run: lake exe cache get
      - name: Reject proof holes and trust escapes
        run: |
          set -euo pipefail
          f=FormalConjectures/ErdosProblems/138Proof.lean
          ! grep -nE '\b(sorry|admit)\b|native_decide|decide \+native|unsafe|axiom |Lean\.ofReduce|Lean\.ofReduceBool|Lean\.trustCompiler' "$f"
      - name: Compile exact proof module
        run: |
          set -o pipefail
          lake build FormalConjectures.ErdosProblems.«138Proof» 2>&1 | tee /tmp/vdw-base-build.log
      - name: Audit exact theorem axioms
        run: |
          cat > /tmp/VdWBaseAxioms.lean <<'EOF'
          import FormalConjectures.ErdosProblems.«138Proof»
          #print axioms Erdos138.monoAPNumber_two_one_kernel
          #print axioms Erdos138.monoAPNumber_two_two_kernel
          EOF
          lake env lean /tmp/VdWBaseAxioms.lean 2>&1 | tee /tmp/vdw-base-axioms.log
          ! grep -E 'sorryAx|Lean\.ofReduce|Lean\.ofReduceBool|Lean\.trustCompiler' /tmp/vdw-base-axioms.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vdw-base-${{ github.run_id }}
          path: |
            /tmp/vdw-base-build.log
            /tmp/vdw-base-axioms.log
          if-no-files-found: warn
