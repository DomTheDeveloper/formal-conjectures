name: Cancel non-A100434 Actions

on:
  push:
    branches: [agent/w320-great-grandchildren]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/w320-release-runners.yml'
  workflow_dispatch:

concurrency:
  group: cancel-non-a100434-actions
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  cancel-other-runs:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Drain every active run except fresh A100434 checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          KEEP_RUN_IDS: '30162034339 30162034340 30162034347'
        shell: bash
        run: |
          set -euo pipefail

          should_keep() {
            local candidate="$1"
            if [ "$candidate" = "$CURRENT_RUN_ID" ]; then
              return 0
            fi
            for keep in $KEEP_RUN_IDS; do
              if [ "$candidate" = "$keep" ]; then
                return 0
              fi
            done
            return 1
          }

          cancel_status() {
            local status="$1"
            local pass=0
            while [ "$pass" -lt 20 ]; do
              pass=$((pass + 1))
              response=$(curl -fsS \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/${REPOSITORY}/actions/runs?status=${status}&per_page=100&page=1")

              cancelled=0
              while read -r run_id; do
                [ -n "$run_id" ] || continue
                if should_keep "$run_id"; then
                  echo "keep run=${run_id} status=${status}"
                  continue
                fi

                code=$(curl -sS -o "response-${run_id}.txt" -w '%{http_code}' \
                  -X POST \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H 'Accept: application/vnd.github+json' \
                  -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "https://api.github.com/repos/${REPOSITORY}/actions/runs/${run_id}/cancel")
                echo "cancel run=${run_id} status=${status} http=${code}"
                cat "response-${run_id}.txt" || true
                test "$code" = 202 -o "$code" = 409
                cancelled=$((cancelled + 1))
              done < <(printf '%s' "$response" | python3 -c 'import json,sys; print("\n".join(str(x["id"]) for x in json.load(sys.stdin)["workflow_runs"]))')

              if [ "$cancelled" -eq 0 ]; then
                break
              fi
              sleep 2
            done
          }

          for status in queued in_progress waiting pending requested; do
            cancel_status "$status"
          done
